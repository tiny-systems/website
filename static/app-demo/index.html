<!doctype html>
<html lang="en">
<head>
  <script src="./shim.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Systems</title>
  <script type="module" crossorigin src="./assets/index-BkTl5Utz.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CfVQqqdh.css">
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" aria-label="Sections">
      <div class="rail-drag"></div>
      <button class="rail-btn" data-view="helpers" aria-label="Helpers" title="Helpers">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="rail-badge" id="rail-badge" hidden></span>
      </button>
      <button class="rail-btn" data-view="gardens" aria-label="Gardens" title="Gardens">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20V10.5M12 13.5C8.5 13.6 6 11.4 5.6 7.6c3.7.1 6.2 2.2 6.4 5.9ZM12 11c.2-3.8 2.8-6.4 6.6-6.6-.2 4-2.8 6.4-6.6 6.6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
      <div class="rail-fill"></div>
      <button class="rail-btn" id="help" aria-label="Help" title="Help">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1" fill="currentColor"/></svg>
      </button>
      <span class="rail-mark" id="rail-mark" title=""></span>
    </nav>

    <!-- Helpers: list and conversation -->
    <section class="list" id="list">
      <div class="list-drag"></div>
      <div class="list-head">
        <label class="search">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" placeholder="Search" autocomplete="off" spellcheck="false">
        </label>
        <button class="icon-btn round" id="new-btn" aria-label="New helper" title="New helper">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="filters" role="tablist" id="filters">
        <button role="tab" data-filter="all" aria-selected="true">All</button>
        <button role="tab" data-filter="ask" aria-selected="false">Needs you <span class="count" id="count-ask"></span></button>
        <button role="tab" data-filter="grow" aria-selected="false">Working</button>
      </div>
      <div class="rows" id="rows"></div>
    </section>

    <section class="pane" id="pane">
      <div class="pane-drag"></div>
      <div id="pane-body" class="pane-body"></div>
    </section>

    <!-- Gardens -->
    <section class="gardens-view" id="gardens-view" hidden>
      <div class="pane-drag"></div>
      <header class="gv-head">
        <div>
          <h1>Gardens</h1>
          <p>Where your helpers live. Each garden is a computer they work on.</p>
        </div>
        <button class="btn primary" id="add-garden">Add garden</button>
      </header>
      <div class="gv-rows" id="gv-rows"></div>
    </section>
  </div>

  <dialog id="new-dialog" class="dialog">
    <form id="new-form" method="dialog">
      <h2>New helper</h2>
      <label class="field">Garden <select name="garden" id="new-garden"></select></label>
      <label class="field">What should it do? <span class="opt">optional</span>
        <textarea name="task" rows="4" placeholder="Fix the flaky checkout test and open a pull request. Leave empty to start a blank session and talk to it in the terminal."></textarea>
      </label>
      <label class="field">Project <span class="opt">optional</span>
        <input name="repo" placeholder="https://github.com/you/your-project">
      </label>
      <details class="advanced">
        <summary>Advanced</summary>
        <div class="row2">
          <label class="field">Assistant
            <select name="agent"><option value="">Claude Code</option><option value="codex">Codex</option></select>
          </label>
          <label class="field">Model <input name="model" placeholder="default"></label>
        </div>
        <label class="field">Container image <input name="image" placeholder="default"></label>
      </details>
      <div class="actions">
        <button type="button" class="btn ghost" id="new-cancel">Cancel</button>
        <button type="submit" class="btn primary">Start helper</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="dialog small">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body" class="body"></p>
      <div class="actions">
        <button class="btn ghost" value="cancel">Keep</button>
        <button class="btn danger" value="ok" id="confirm-ok">Remove</button>
      </div>
    </form>
  </dialog>

  <dialog id="wizard" class="dialog wizard"><div class="wz" id="wz"></div></dialog>
  <div class="menu" id="menu" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
