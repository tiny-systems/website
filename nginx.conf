server {
    listen 8080;
    server_name _;
    root /site;

    # Behind the ingress we are :8080; absolute Location headers would leak
    # that port. Relative redirects let the ingress own the host.
    absolute_redirect off;

    # old-platform 301s, populated from the old sitemap
    include /etc/nginx/conf.d/redirects.inc;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    # fingerprint-free but small; short cache for html, long for assets
    location /static/ {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
    }
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/index.html =404;
    }
}
