# Two sites from one image, picked by host (the ingress passes it through).
#   tinysystems.io  → /site/io   the app
#   tinysystems.dev → /site/dev  tiny: docs, compare, blog
# Anything else (health checks, the bare pod IP) gets the app site.

map $uri $static_cache {
    ~^/static/      "public, max-age=86400";
    /favicon.svg    "public, max-age=86400";
    default         "public, max-age=300";
}

server {
    listen 8080 default_server;
    server_name tinysystems.io _;
    root /site/io;

    # Behind the ingress we are :8080; absolute Location headers would leak
    # that port. Relative redirects let the ingress own the host.
    absolute_redirect off;

    # tiny moved to its own domain on 2026-11-27: same path, new host, so
    # search engines carry each page's ranking over.
    location = /tiny  { return 301 https://tinysystems.dev/; }
    location ^~ /tiny/ { return 301 https://tinysystems.dev/; }
    location ^~ /docs/    { return 301 https://tinysystems.dev$request_uri; }
    location ^~ /compare/ { return 301 https://tinysystems.dev$request_uri; }
    location /blog/        { return 301 https://tinysystems.dev$request_uri; }
    location = /docs      { return 301 https://tinysystems.dev/docs/; }
    location = /blog      { return 301 https://tinysystems.dev/blog/; }
    location = /compare   { return 301 https://tinysystems.dev/compare/; }
    location = /llms.txt  { return 301 https://tinysystems.dev/llms.txt; }

    # old-platform 301s, populated from the old sitemap
    include /etc/nginx/conf.d/redirects.inc;

    include /etc/nginx/conf.d/common.inc;
}

server {
    listen 8080;
    server_name tinysystems.dev;
    root /site/dev;
    absolute_redirect off;
    include /etc/nginx/conf.d/common.inc;
}
